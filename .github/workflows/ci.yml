name: release-gate-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate qualified example
        run: pyrolysis-validate examples/cellulose_tga_run.json

      - name: Verify qualified example suite
        run: pyrolysis-examples examples/suite_manifest.json --reruns 1

      - name: Build and inspect wheel
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          rm -rf wheelhouse
          python -m pip wheel . --no-deps --wheel-dir wheelhouse
          python tools/verify_wheel.py wheelhouse/*.whl

      - name: Verify clean wheel installation
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          rm -rf wheelcheck
          python -m venv wheelcheck
          wheelcheck/bin/python -m pip install --upgrade pip
          wheelcheck/bin/python -m pip install wheelhouse/*.whl
          wheelcheck/bin/pyrolysis-validate examples/cellulose_tga_run.json
          wheelcheck/bin/pyrolysis-examples examples/suite_manifest.json --reruns 1
